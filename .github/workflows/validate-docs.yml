name: validate-docs

# Drift detector: checks that identifiers referenced in the docs (MCP tool
# names, Prometheus metrics, env vars) still exist in the mcp-hangar product
# source. See development/DOCS_VALIDATION.md for scope and limitations.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so docs drift is caught even when nobody edits the docs repo.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # promtool ships inside the Prometheus release tarball. Pinned rather
  # than `latest`, so this gate does not turn red on somebody else's
  # release day -- the same rule helm-charts applies to its own pins.
  PROMETHEUS_VERSION: v3.13.2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v7
        with:
          path: docs

      - name: Checkout mcp-hangar source
        uses: actions/checkout@v7
        with:
          repository: mcp-hangar/mcp-hangar
          path: source
          # Public repo: no token needed. For a private source, set a PAT in
          # the MCP_HANGAR_REPO_TOKEN secret and uncomment the next line.
          # token: ${{ secrets.MCP_HANGAR_REPO_TOKEN }}

      # The CRD schema is read from here, never from a copy in this repo: a
      # copied schema drifts, and a drifted schema is a gate that approves the
      # wrong thing.
      - name: Checkout mcp-hangar-operator
        uses: actions/checkout@v7
        with:
          repository: mcp-hangar/mcp-hangar-operator
          path: operator

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Runs before the drift detector on purpose: it needs no source checkout
      # and finishes in well under a second, so a broken link is reported
      # immediately rather than after cloning the product.
      - name: Check internal links and anchors
        run: python docs/scripts/check_links.py --docs docs

      - name: Check CLI commands cited in bash blocks
        run: python docs/scripts/check_cli.py --docs docs --source source

      - name: Check Kubernetes manifests against the operator CRDs
        run: |
          pip install --quiet pyyaml
          python docs/scripts/check_manifests.py --docs docs --operator operator

      - name: Check PromQL queries parse
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION#v}.linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin --strip-components=1 "prometheus-${PROMETHEUS_VERSION#v}.linux-amd64/promtool"
          python docs/scripts/check_promql.py --docs docs

      - name: Check version-currency claims and freshness tokens
        run: python docs/scripts/check_freshness.py --docs docs --source source

      - name: Validate docs against source
        run: python docs/scripts/validate_docs.py --docs docs --source source
